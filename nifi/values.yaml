namespace: nifi

image:
  repository: apache/nifi
  tag: "2.7.2"
  pullPolicy: IfNotPresent

host: nifi.titusefferian.dev

credentials:
  username: admin
  password: ChangeMe-NiFi-Pass1
  sensitivePropsKey: ChangeMeSensitiveKey123

jvm:
  heapInit: 2g
  heapMax: 2g

resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    memory: 4Gi

storage:
  storageClass:
    name: nifi-gp3
    kmsKeyId: ""
  size: 100Gi

ingress:
  enabled: false

  certificateArn: ""

  loadBalancerName: tituseff-playground-nifi

  inboundCidrs: "0.0.0.0/0"

  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
