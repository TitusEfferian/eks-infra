# =============================================================================
# nifi-credentials — single-user login + the sensitive-properties key.
#
# !!! WARNING — PLAINTEXT IN GIT (PLAYGROUND ONLY) !!!
# The values come straight from values.yaml, which is committed in clear text.
# This was an explicit choice for the playground. For anything real, replace this
# template with External Secrets / Sealed Secrets / SOPS.
#
# Consumed by the StatefulSet as env vars (secretKeyRef). NiFi reads them ONLY at
# start, so the StatefulSet carries a checksum/secret annotation of this rendered
# template: changing a credential changes the pod template and rolls the pod.
#
# Rules (start.sh fails SILENTLY otherwise — grep the pod log for "ERROR:"):
#   username >= 4 chars; password >= 12 chars;
#   sensitivePropsKey >= 12 chars, alphanumeric only, NEVER changed after first start.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nifi-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nifi
    app.kubernetes.io/part-of: nifi
type: Opaque
stringData:
  username: {{ .Values.credentials.username | quote }}
  password: {{ .Values.credentials.password | quote }}
  sensitivePropsKey: {{ .Values.credentials.sensitivePropsKey | quote }}
