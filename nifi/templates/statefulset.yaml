apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: nifi
    app.kubernetes.io/part-of: nifi
spec:
  serviceName: nifi-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nifi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nifi
        app.kubernetes.io/part-of: nifi
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-conf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "[ -f /seed/nifi.properties ] || cp -a /opt/nifi/nifi-current/conf/. /seed/"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /seed
              subPath: conf
      containers:
        - name: nifi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: username
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: password
            - name: NIFI_SENSITIVE_PROPS_KEY
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: sensitivePropsKey
            - name: NIFI_WEB_HTTPS_PORT
              value: "8443"
            - name: NIFI_WEB_HTTPS_HOST
              value: "0.0.0.0"
            - name: NIFI_WEB_PROXY_HOST
              value: "{{ .Values.host }},{{ .Values.host }}:443"
            - name: NIFI_JVM_HEAP_INIT
              value: {{ .Values.jvm.heapInit | quote }}
            - name: NIFI_JVM_HEAP_MAX
              value: {{ .Values.jvm.heapMax | quote }}
            - name: NIFI_CLUSTER_IS_NODE
              value: "false"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              scheme: HTTPS
              port: 8443
              path: /nifi-api/authentication/configuration
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: 8443
              path: /nifi-api/authentication/configuration
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /opt/nifi/nifi-current/conf
              subPath: conf
            - name: data
              mountPath: /opt/nifi/nifi-current/state
              subPath: state
            - name: data
              mountPath: /opt/nifi/nifi-current/database_repository
              subPath: database_repository
            - name: data
              mountPath: /opt/nifi/nifi-current/flowfile_repository
              subPath: flowfile_repository
            - name: data
              mountPath: /opt/nifi/nifi-current/content_repository
              subPath: content_repository
            - name: data
              mountPath: /opt/nifi/nifi-current/provenance_repository
              subPath: provenance_repository
            - name: data
              mountPath: /opt/nifi/nifi-current/nar_extensions
              subPath: nar_extensions
            - name: data
              mountPath: /opt/nifi/nifi-current/python_extensions
              subPath: python_extensions
            - name: data
              mountPath: /opt/nifi/nifi-current/logs
              subPath: logs
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/name: nifi
          app.kubernetes.io/part-of: nifi
      spec:
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        storageClassName: {{ .Values.storage.storageClass.name }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
